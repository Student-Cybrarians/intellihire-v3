name: Preview

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          pip install -r services/intelligence/requirements.txt
      - name: Deploy preview
        run: |
          npm run build
          npx wrangler pages deploy .next --project-name=intellihire-v3 --branch=${{ github.head_ref }} --commit-dirty=true
      - name: Verify preview
        run: npm run test
