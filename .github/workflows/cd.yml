name: CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          pip install -r services/intelligence/requirements.txt
      - name: Deploy
        run: |
          npm run build
          npm run deploy
      - name: Verify deployment
        run: npm run test
