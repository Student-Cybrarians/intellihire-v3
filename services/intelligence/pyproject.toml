[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intellihire-intelligence-service"
version = "3.0.0"
description = "IntelliHire v3 Python Intelligence Platform"
readme = "README.md"
authors = [{ name = "Boss Michael & Engineering Division", email = "dev@intellihire.internal" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.5.0",
    "scikit-learn>=1.4.0",
    "shap>=0.45.0",
    "fairlearn>=0.10.0",
    "spacy>=3.7.0"
]
docs = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0"
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.98.0"
]
